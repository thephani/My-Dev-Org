name: SimpleSfCLI - Validate PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: 'true'
  SF_ENVIRONMENT: ${{ vars.SF_ENVIRONMENT || 'PRODUCTION' }}
  SF_DISABLE_TELEMETRY: 'true'
  SF_DISABLE_AUTOUPDATE: 'true'

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: salesforce-comparison
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find PR metadata changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config diff.renames false
          base=$(git merge-base "$BASE_SHA" HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git diff --name-only "$base" HEAD -- force-app/main/default > "$RUNNER_TEMP/pr-metadata-changes"
          if [[ -s "$RUNNER_TEMP/pr-metadata-changes" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Salesforce metadata changes to validate.'
          fi

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate PR changes with SimpleSfCLI
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_COMMIT: ${{ steps.changes.outputs.base }}
          SF_USERNAME: ${{ vars.SF_USERNAME }}
          SF_CLIENT_ID: ${{ vars.DEV_CLIENT_ID }}
          SF_JWT_KEY: ${{ secrets.SIMPLECLI_KEY }}
        run: |
          [[ -n "$SF_USERNAME" ]] || { echo '::error::Set the SF_USERNAME GitHub variable.'; exit 1; }
          [[ -n "$SF_CLIENT_ID" ]] || { echo '::error::Set the DEV_CLIENT_ID GitHub variable.'; exit 1; }
          [[ -n "$SF_JWT_KEY" ]] || { echo '::error::Set the SIMPLECLI_KEY GitHub secret.'; exit 1; }
          umask 077
          printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/salesforce-jwt.key"
          echo "Validating Salesforce metadata changes..."
          npx simple-sf-cli \
            -u "$SF_USERNAME" -c "$SF_CLIENT_ID" \
            -k "$RUNNER_TEMP/salesforce-jwt.key" -e PROD \
            -v -t RunLocalTests \
            > "$RUNNER_TEMP/salesforce-validation.log" 2>&1

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/salesforce-jwt.key" "$RUNNER_TEMP/salesforce-validation.log"
