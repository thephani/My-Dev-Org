name: Validate PR on flow deployment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch: null

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create folder and save server.key
        run: echo "${{ secrets.JWT_KEY__SFDX }}" > ./server.key

      - name: Install SFDX CLI and Scanner
        run: |
          npm install @salesforce/cli --global

      - name: Authenticate org
        run: |
          sf org login jwt --client-id ${{ vars.DEV_CLIENT_ID }} --jwt-key-file ./server.key --username phani@force.com --set-default-dev-hub --alias my-dev-org
          
      - name: Run All Test
        run: sfdx force:apex:test:run
      
