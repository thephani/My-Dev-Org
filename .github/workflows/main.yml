name: Validate PR on flow deployment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch: null

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Create folder and save server.key
        run: echo "${{ secrets.SIMPLECLI_KEY }}" > ./server.key

      - name: Install SFDX CLI and Scanner
        run: |
          npm install @salesforce/cli --global

      - name: Authenticate org
        run: |
          sf org login jwt --client-id ${{ vars.DEV_CLIENT_ID }} --jwt-key-file ./server.key --username ${{vars.SF_USERNAME}} --set-default-dev-hub --alias my-dev-org
          
      # - name: Run All Test
      #   run: sf apex run test --target-org my-dev-org --result-format human --code-coverage --wait 10
      
